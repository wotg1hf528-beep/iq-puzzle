<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ألغاز العباقرة - 150 مرحلة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f172a; --surface: #1e293b; --primary: #38bdf8; --accent: #f43f5e; --text: #f8fafc; --success: #10b981; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; user-select: none; }
        body { background-color: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* =========================================
           1. القائمة الرئيسية (الواجهة)
           ========================================= */
        #mainMenu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, #1e293b 0%, #0f172a 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 50; }
        .game-title { font-size: 45px; font-weight: 900; color: var(--primary); text-shadow: 0 5px 15px rgba(56, 189, 248, 0.4); margin-bottom: 10px; }
        .game-subtitle { font-size: 16px; color: #cbd5e1; margin-bottom: 50px; }
        
        .btn-play { background: var(--success); color: white; border: none; padding: 15px 60px; border-radius: 30px; font-size: 24px; font-weight: bold; cursor: pointer; box-shadow: 0 10px 20px rgba(16, 185, 129, 0.4); transition: 0.3s; margin-bottom: 20px; }
        .btn-play:active { transform: scale(0.95); }
        
        .btn-settings { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 10px 30px; border-radius: 20px; font-size: 16px; cursor: pointer; margin-bottom: 30px; }

        /* =========================================
           2. شاشة اللعب
           ========================================= */
        #gameScreen { display: none; flex-direction: column; height: 100%; position: relative; }
        .top-bar { display: flex; justify-content: space-between; padding: 20px; font-weight: bold; font-size: 18px; background: rgba(30, 41, 59, 0.9); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .coin-box { color: #fbbf24; display: flex; align-items: center; gap: 5px; }

        .puzzle-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; overflow-y: auto; padding-bottom: 80px; }
        .puzzle-container { width: 100%; max-width: 400px; background: var(--surface); padding: 30px 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
        
        .level-title { color: var(--primary); font-size: 22px; font-weight: 900; margin-bottom: 15px; }
        .puzzle-desc { font-size: 16px; line-height: 1.6; margin-bottom: 30px; color: #cbd5e1; }

        .options-grid { display: flex; flex-direction: column; gap: 10px; }
        .option-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--text); padding: 15px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .option-btn:active { background: var(--primary); color: #000; }
        
        .input-box { width: 100%; background: rgba(0,0,0,0.3); border: 2px solid rgba(255,255,255,0.1); color: white; padding: 15px; border-radius: 12px; font-size: 18px; text-align: center; margin-bottom: 15px; outline: none; }
        .submit-btn { width: 100%; background: var(--success); color: white; border: none; padding: 15px; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; }

        .hint-btn { margin-top: 25px; background: none; border: none; color: #fbbf24; font-size: 14px; text-decoration: underline; cursor: pointer; font-weight: bold; }
        .hint-text { display: none; margin-top: 15px; padding: 15px; background: rgba(251, 191, 36, 0.1); border: 1px dashed #fbbf24; border-radius: 8px; font-size: 13px; color: #fef3c7; }

        /* =========================================
           3. مساحات الإعلانات (Ads)
           ========================================= */
        /* البانر السفلي الدائم */
        .ad-banner { position: absolute; bottom: 0; width: 100%; height: 60px; background: repeating-linear-gradient(45deg, #222, #222 10px, #333 10px, #333 20px); display: flex; justify-content: center; align-items: center; color: rgba(255,255,255,0.5); font-size: 12px; font-weight: bold; z-index: 40; border-top: 1px solid #444; }
        
        /* إعلان الشاشة الكاملة (بين المراحل) */
        #interstitialAd { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 150; flex-direction: column; justify-content: center; align-items: center; color: white; }
        .ad-content { width: 80%; height: 50%; background: #222; border: 2px dashed #555; display: flex; justify-content: center; align-items: center; font-size: 20px; color: #888; margin-bottom: 20px; }
        .btn-skip-ad { background: #333; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; display: none; }

        /* نوافذ منبثقة */
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center; }
        .popup { background: var(--surface); padding: 30px; border-radius: 20px; text-align: center; max-width: 300px; border: 1px solid rgba(255,255,255,0.1); }
        .popup h2 { margin-bottom: 10px; }
        .popup button { margin-top: 20px; background: var(--primary); color: #000; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <!-- موسيقى اللعبة -->
    <!-- رابط موسيقى مجانية خفيفة، تعمل تلقائياً عند الضغط على "ابدأ" -->
    <audio id="bgMusic" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mp3">
    </audio>

    <!-- 1. واجهة القائمة الرئيسية -->
    <div id="mainMenu">
        <div class="game-title">ألغاز العباقرة</div>
        <div class="game-subtitle">تحديات المنطق والذكاء - 150 مرحلة</div>
        <button class="btn-play" onclick="startGame()">ابدأ اللعب ▶</button>
        <button class="btn-settings" id="btnSound" onclick="toggleSound()">🔊 الموسيقى: شغالة</button>
        <div style="font-size: 12px; color: #666; position: absolute; bottom: 70px;">الإصدار 1.0.0 (ننتظر التحديث الجاي)</div>
        <div class="ad-banner">مساحة إعلانية (Google AdMob Banner)</div>
    </div>

    <!-- 2. شاشة اللعب -->
    <div id="gameScreen">
        <div class="top-bar">
            <div id="levelDisplay">المرحلة: 1 / 150</div>
            <div class="coin-box">💰 <span id="coinDisplay">50</span></div>
        </div>

        <div class="puzzle-area">
            <div class="puzzle-container">
                <div class="level-title" id="lvlTitle">جارِ التحميل...</div>
                <div class="puzzle-desc" id="lvlDesc"></div>
                
                <div id="answerArea"></div>

                <button class="hint-btn" onclick="useHint()">💡 استخدم تلميح (-25 عملة)</button>
                <div class="hint-text" id="hintText"></div>
            </div>
        </div>

        <div class="ad-banner">مساحة إعلانية (Google AdMob Banner)</div>
    </div>

    <!-- 3. شاشة إعلان الشاشة الكاملة (تظهر كل 5 مراحل) -->
    <div id="interstitialAd">
        <div class="ad-content">مساحة إعلان فيديو (AdMob Interstitial)</div>
        <div id="adTimer" style="margin-bottom: 15px;">يمكنك التخطي بعد 3 ثواني...</div>
        <button class="btn-skip-ad" id="btnSkipAd" onclick="closeAd()">تخطي الإعلان ➔</button>
    </div>

    <!-- نافذة النتيجة -->
    <div id="overlay">
        <div class="popup">
            <h2 id="popupTitle"></h2>
            <p id="popupMsg"></p>
            <button onclick="nextLevel()" id="popupBtn">التالي</button>
        </div>
    </div>

    <script>
        // ==========================================
        // توليد 150 مرحلة للعبة
        // ==========================================
        const levels = [];

        // المراحل الأولى المخصصة والممتعة
        levels.push({
            title: "لغز الطيور النادرة",
            desc: "تمتلك خانة فيها طير أرفلي وطير كعكول. إذا بعت الأرفلي بـ 50 ألف، واشتريت اثنين حمر بـ 20 ألف، كم ألف دينار بقي معك من الصفقة؟",
            type: "options",
            options: ["20", "30", "50", "10"],
            answer: "30", 
            hint: "اطرح سعر الشراء (20) من سعر البيع (50)."
        });
        levels.push({
            title: "صيد النهر",
            desc: "قطعت عود خشب لتصنع سنارة. إذا اصطدت 4 سمكات، وأكلت نصفها بعد القلي، ثم اصطدت سمكتين إضافيتين. كم سمكة لديك الآن؟",
            type: "input",
            answer: "4",
            hint: "نصف الأربعة 2. أضف عليها السمكتين الجديدتين."
        });
        levels.push({
            title: "الضربة المقوسة R2",
            desc: "أنت تلعب eFootball في الدقيقة 89. المهاجم منفرد، ما هو الزر الأفضل لتسديدة دقيقة بالزاوية البعيدة؟",
            type: "options",
            options: ["مربع فقط", "R1", "R2", "L1 + مربع"],
            answer: "R2",
            hint: "الزر الشهير للـ Finesse Shot (التسديدة المقوسة)."
        });
        levels.push({
            title: "برمجة البوت",
            desc: "صممت بوت تلغرام بالبايثون يعطيك 5 نقاط لكل إحالة (Referral). إذا دعوت 6 أشخاص، كم عدد النقاط التي جمعتها؟",
            type: "input",
            answer: "30",
            hint: "اضرب عدد الأشخاص في عدد النقاط لكل شخص."
        });
        levels.push({
            title: "لغز الكيا",
            desc: "أبو صابر يقود كيا فيها 10 ركاب. نزل 4 وصعد 2. كم عدد الأشخاص في السيارة الآن (بمن فيهم السائق)؟",
            type: "options",
            options: ["8", "9", "10", "12"],
            answer: "9",
            hint: "لا تنسَ أن تحسب السائق (أبو صابر) مع الركاب المتبقين."
        });

        // توليد المراحل من 6 إلى 150 برمجياً لضمان اكتمال اللعبة بـ 150 مرحلة حقيقية
        for (let i = 6; i <= 150; i++) {
            // توليد معادلات رياضية وألغاز تسلسلية لزيادة الصعوبة
            let num1 = Math.floor(Math.random() * 20) + i;
            let num2 = Math.floor(Math.random() * 10) + 1;
            let answer = num1 * num2;
            
            levels.push({
                title: `تحدي العباقرة #${i}`,
                desc: `حل المعادلة الذهنية التالية بسرعة: إذا كان الرقم الأساسي هو ${num1}، قم بضربه في ${num2}. كم الناتج؟`,
                type: "input",
                answer: answer.toString(),
                hint: `عملية ضرب بسيطة: ${num1} × ${num2}`
            });
        }

        // ==========================================
        // المنطق البرمجي
        // ==========================================
        let currentLevel = parseInt(localStorage.getItem('savedLevel150')) || 0;
        let coins = parseInt(localStorage.getItem('savedCoins150')) || 50;
        let isMusicPlaying = false;
        let bgMusic = document.getElementById('bgMusic');

        // تشغيل الموسيقى
        function toggleSound() {
            if(isMusicPlaying) {
                bgMusic.pause();
                document.getElementById('btnSound').innerText = "🔇 الموسيقى: صامت";
            } else {
                bgMusic.play().catch(e => console.log("المتصفح يمنع التشغيل التلقائي"));
                document.getElementById('btnSound').innerText = "🔊 الموسيقى: شغالة";
            }
            isMusicPlaying = !isMusicPlaying;
        }

        // بدء اللعبة
        function startGame() {
            document.getElementById('mainMenu').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'flex';
            if(!isMusicPlaying) { toggleSound(); } // تشغيل الموسيقى عند الضغط
            initLevel();
        }

        function initLevel() {
            if (currentLevel >= 150) {
                document.querySelector('.puzzle-container').innerHTML = "<h2 style='color:var(--primary);'>ختمت اللعبة!</h2><p>انتظر التحديث القادم.</p>";
                return;
            }

            const level = levels[currentLevel];
            document.getElementById('levelDisplay').innerText = `المرحلة: ${currentLevel + 1} / 150`;
            document.getElementById('coinDisplay').innerText = coins;
            document.getElementById('lvlTitle').innerText = level.title;
            document.getElementById('lvlDesc').innerText = level.desc;
            document.getElementById('hintText').style.display = 'none';

            const answerArea = document.getElementById('answerArea');
            answerArea.innerHTML = ''; 

            if (level.type === 'options') {
                const grid = document.createElement('div');
                grid.className = 'options-grid';
                level.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerText = opt;
                    btn.onclick = () => checkAnswer(opt);
                    grid.appendChild(btn);
                });
                answerArea.appendChild(grid);
            } 
            else if (level.type === 'input') {
                answerArea.innerHTML = `
                    <input type="tel" id="userInput" class="input-box" placeholder="الجواب..." autocomplete="off">
                    <button class="submit-btn" onclick="checkAnswer(document.getElementById('userInput').value)">تأكيد الجواب</button>
                `;
            }
        }

        function checkAnswer(userAnswer) {
            const correctAnswer = levels[currentLevel].answer;
            const overlay = document.getElementById('overlay');
            const popupTitle = document.getElementById('popupTitle');
            const popupMsg = document.getElementById('popupMsg');
            const popupBtn = document.getElementById('popupBtn');

            if (userAnswer.trim().toLowerCase() === correctAnswer.trim().toLowerCase()) {
                popupTitle.innerText = "🎉 إجابة صحيحة!";
                popupTitle.style.color = "var(--success)";
                popupMsg.innerText = "حصلت على +10 عملات.";
                coins += 10;
                popupBtn.onclick = () => { 
                    currentLevel++; 
                    saveData(); 
                    overlay.style.display = "none"; 
                    
                    // نظام الإعلانات: إظهار إعلان كل 5 مراحل
                    if(currentLevel % 5 === 0 && currentLevel < 150) {
                        showAd();
                    } else {
                        initLevel(); 
                    }
                };
            } else {
                popupTitle.innerText = "❌ إجابة خاطئة!";
                popupTitle.style.color = "var(--accent)";
                popupMsg.innerText = "حاول مرة ثانية!";
                popupBtn.onclick = () => overlay.style.display = "none";
            }
            
            overlay.style.display = "flex";
            saveData();
        }

        function useHint() {
            if (coins >= 25) {
                coins -= 25;
                document.getElementById('coinDisplay').innerText = coins;
                document.getElementById('hintText').innerText = levels[currentLevel].hint;
                document.getElementById('hintText').style.display = 'block';
                saveData();
            } else {
                alert("عملاتك غير كافية! شارك اللعبة لتربح الذهب (قريباً).");
            }
        }

        function saveData() {
            localStorage.setItem('savedLevel150', currentLevel);
            localStorage.setItem('savedCoins150', coins);
        }

        // ==========================================
        // نظام الإعلانات الوهمي (تطبيق فعلي)
        // ==========================================
        function showAd() {
            const adScreen = document.getElementById('interstitialAd');
            const btnSkip = document.getElementById('btnSkipAd');
            const adTimer = document.getElementById('adTimer');
            
            adScreen.style.display = 'flex';
            btnSkip.style.display = 'none';
            
            let timeLeft = 3;
            adTimer.innerText = `يمكنك التخطي بعد ${timeLeft} ثواني...`;
            
            let timer = setInterval(() => {
                timeLeft--;
                adTimer.innerText = `يمكنك التخطي بعد ${timeLeft} ثواني...`;
                if(timeLeft <= 0) {
                    clearInterval(timer);
                    adTimer.innerText = "";
                    btnSkip.style.display = 'block';
                }
            }, 1000);
        }

        function closeAd() {
            document.getElementById('interstitialAd').style.display = 'none';
            initLevel();
        }
    </script>
</body>
</html>
